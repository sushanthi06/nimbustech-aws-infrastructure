AWSTemplateFormatVersion: '2010-09-09'
Description: 'Secure EC2 Pattern - SSM access, IMDSv2, CloudWatch monitoring (AI-assisted)'

# This template was generated with AI assistance (Claude)
# See ai-prompts.md for the prompts used and what was fixed

Parameters:
  ProjectName:
    Type: String
    Description: Project name for resource naming

  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  VPCId:
    Type: String
    Description: VPC ID

  SubnetId:
    Type: String
    Description: Private subnet ID for EC2 instance

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
    Description: EC2 instance type

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: Ubuntu 22.04 LTS AMI (auto-updated)

  MonitoringInterval:
    Type: Number
    Default: 60
    AllowedValues:
      - 60
      - 300
      - 600
    Description: CloudWatch metrics collection interval (seconds)

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653
    Description: CloudWatch Logs retention period

Resources:
  # Security Group - Least Privilege
  # AI initially suggested allowing all egress - THIS WAS FIXED
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-${Environment}-secure-ec2-sg
      GroupDescription: Secure EC2 - no SSH, SSM only
      VpcId: !Ref VPCId
      # NO INGRESS RULES - SSM doesn't need open ports
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-secure-ec2-sg

  # Egress: HTTPS only (for AWS APIs)
  SecurityGroupEgressHTTPS:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: HTTPS for AWS API calls (SSM, CloudWatch)

  # Egress: HTTP for package managers
  SecurityGroupEgressHTTP:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: HTTP for package managers

  # IAM Role for EC2
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-secure-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # SSM access (no SSH needed)
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        # CloudWatch agent
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-secure-ec2-role

  # Instance Profile
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${ProjectName}-${Environment}-secure-ec2-profile
      Roles:
        - !Ref InstanceRole

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/ec2/${ProjectName}/${Environment}
      RetentionInDays: !Ref LogRetentionDays

  # EC2 Instance with Security Hardening
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      IamInstanceProfile: !Ref InstanceProfile

      # IMDSv2 Enforcement - AI got this RIGHT
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required  # IMDSv2 only (prevents SSRF)
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: enabled

      # Detailed monitoring
      Monitoring: false  # Set to true for 1-minute metrics (costs extra)

      # EBS encryption
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Encrypted: true
            DeleteOnTermination: true

      # User data - Install CloudWatch agent
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # Update system
          apt-get update -y
          apt-get upgrade -y

          # Install CloudWatch agent
          wget https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
          dpkg -i -E ./amazon-cloudwatch-agent.deb
          rm amazon-cloudwatch-agent.deb

          # Configure CloudWatch agent
          cat > /opt/aws/amazon-cloudwatch-agent/etc/config.json <<EOF
          {
            "metrics": {
              "namespace": "${ProjectName}/${Environment}",
              "metrics_collected": {
                "mem": {
                  "measurement": [
                    {"name": "mem_used_percent", "rename": "MemoryUtilization", "unit": "Percent"}
                  ],
                  "metrics_collection_interval": ${MonitoringInterval}
                },
                "disk": {
                  "measurement": [
                    {"name": "used_percent", "rename": "DiskUtilization", "unit": "Percent"}
                  ],
                  "metrics_collection_interval": ${MonitoringInterval},
                  "resources": ["*"]
                }
              }
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/app/*.log",
                      "log_group_name": "/aws/ec2/${ProjectName}/${Environment}",
                      "log_stream_name": "{instance_id}"
                    }
                  ]
                }
              }
            }
          }
          EOF

          # Start CloudWatch agent
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config \
            -m ec2 \
            -s \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

          # Create app log directory
          mkdir -p /var/log/app
          chmod 755 /var/log/app

          echo "Bootstrap complete"

      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-secure-ec2
        - Key: Module
          Value: secure-ec2
        - Key: Environment
          Value: !Ref Environment

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref Instance

  InstancePrivateIP:
    Description: Private IP address
    Value: !GetAtt Instance.PrivateIp

  SSMConnectCommand:
    Description: Command to connect via SSM
    Value: !Sub aws ssm start-session --target ${Instance} --region ${AWS::Region}

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref SecurityGroup

  LogGroupName:
    Description: CloudWatch Log Group name
    Value: !Ref LogGroup
