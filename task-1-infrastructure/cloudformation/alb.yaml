AWSTemplateFormatVersion: '2010-09-09'
Description: 'NimbusTech Application Load Balancer'

Parameters:
  ProjectName:
    Type: String
    Default: nimbustech

  PublicSubnet1:
    Type: String
    Description: Public Subnet 1 ID

  PublicSubnet2:
    Type: String
    Description: Public Subnet 2 ID

  ALBSecurityGroup:
    Type: String
    Description: ALB Security Group ID

  VPCId:
    Type: String
    Description: VPC ID

Resources:
  # Application Load Balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-alb
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      IpAddressType: ipv4
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-alb

  # Target Group
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-app-tg
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VPCId
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      DeregistrationDelay: 30
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-app-tg

  # HTTP Listener (redirect to HTTPS in production)
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      # In production with SSL certificate, use:
      # - Type: redirect
      #   RedirectConfig:
      #     Protocol: HTTPS
      #     Port: 443
      #     StatusCode: HTTP_301

  # HTTPS Listener (uncomment when you have ACM certificate)
  # HTTPSListener:
  #   Type: AWS::ElasticLoadBalancingV2::Listener
  #   Properties:
  #     LoadBalancerArn: !Ref LoadBalancer
  #     Port: 443
  #     Protocol: HTTPS
  #     Certificates:
  #       - CertificateArn: !Ref CertificateArn
  #     SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  #     DefaultActions:
  #       - Type: forward
  #         TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerArn:
    Description: ALB ARN
    Value: !Ref LoadBalancer
    Export:
      Name: !Sub ${ProjectName}-LoadBalancerArn

  LoadBalancerDNSName:
    Description: ALB DNS Name
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub ${ProjectName}-LoadBalancerDNS

  TargetGroupArn:
    Description: Target Group ARN
    Value: !Ref TargetGroup
    Export:
      Name: !Sub ${ProjectName}-TargetGroupArn

  ApplicationURL:
    Description: Application URL
    Value: !Sub http://${LoadBalancer.DNSName}
