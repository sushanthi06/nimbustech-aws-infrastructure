AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Billing Alarms for $350 USD threshold with service-specific monitoring'

Parameters:
  BillingThreshold:
    Type: Number
    Default: 350
    Description: Main billing threshold in USD

  WarningThreshold:
    Type: Number
    Default: 300
    Description: Early warning threshold in USD

  NotificationEmail:
    Type: String
    Default: finance@nimbustech.com
    Description: Email address for billing alerts

  EC2Threshold:
    Type: Number
    Default: 50
    Description: EC2 service cost threshold in USD

  RDSThreshold:
    Type: Number
    Default: 120
    Description: RDS service cost threshold in USD

  DataTransferThreshold:
    Type: Number
    Default: 100
    Description: Data transfer cost threshold in USD

Resources:
  # SNS Topic for billing alerts
  BillingAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: nimbustech-billing-alerts
      DisplayName: NimbusTech Billing Alerts
      Tags:
        - Key: Name
          Value: NimbusTech Billing Alerts
        - Key: Purpose
          Value: Cost monitoring and alerting

  # Email subscription
  BillingEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BillingAlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # Main billing alarm - $350 threshold
  BillingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nimbustech-billing-350-usd
      AlarmDescription: Alert when estimated monthly charges exceed $350 USD
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Period: 21600  # 6 hours
      Statistic: Maximum
      Threshold: !Ref BillingThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: Currency
          Value: USD
      AlarmActions:
        - !Ref BillingAlertsTopic
      OKActions:
        - !Ref BillingAlertsTopic

  # Early warning alarm - $300 threshold
  BillingWarningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nimbustech-billing-300-usd-warning
      AlarmDescription: Early warning - estimated monthly charges exceed $300 USD
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Period: 21600
      Statistic: Maximum
      Threshold: !Ref WarningThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: Currency
          Value: USD
      AlarmActions:
        - !Ref BillingAlertsTopic
      OKActions:
        - !Ref BillingAlertsTopic

  # EC2 cost alarm
  EC2CostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nimbustech-ec2-cost-alarm
      AlarmDescription: Alert when EC2 charges exceed threshold
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Period: 21600
      Statistic: Maximum
      Threshold: !Ref EC2Threshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: Currency
          Value: USD
        - Name: ServiceName
          Value: AmazonEC2
      AlarmActions:
        - !Ref BillingAlertsTopic

  # RDS cost alarm
  RDSCostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nimbustech-rds-cost-alarm
      AlarmDescription: Alert when RDS charges exceed threshold
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Period: 21600
      Statistic: Maximum
      Threshold: !Ref RDSThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: Currency
          Value: USD
        - Name: ServiceName
          Value: AmazonRDS
      AlarmActions:
        - !Ref BillingAlertsTopic

  # Data transfer cost alarm
  DataTransferCostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nimbustech-data-transfer-cost-alarm
      AlarmDescription: Alert when data transfer charges exceed threshold (possible DDoS or misconfiguration)
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Period: 21600
      Statistic: Maximum
      Threshold: !Ref DataTransferThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: Currency
          Value: USD
        - Name: ServiceName
          Value: AWSDataTransfer
      AlarmActions:
        - !Ref BillingAlertsTopic

Outputs:
  SNSTopicArn:
    Description: ARN of SNS topic for billing alerts
    Value: !Ref BillingAlertsTopic
    Export:
      Name: !Sub '${AWS::StackName}-SNSTopicArn'

  BillingAlarmName:
    Description: Name of the main billing alarm
    Value: !Ref BillingAlarm
    Export:
      Name: !Sub '${AWS::StackName}-BillingAlarmName'
